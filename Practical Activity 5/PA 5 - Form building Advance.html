<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us</title>

        <link rel="stylesheet" href="Style.css">
    </head>
    <body>
        
        <main class="contact-container">
            <header><h1>Get In Touch</h1></header>
            <section class="contact-information">
                <h2>Contact Information</h2>
                <p>e: ruth@example.co.uk</p>
                <p>t: 0123456789</p>
                <p>Ruth Vlismas, 13 Avondale Road, Bath, BA1 3EG</p>
            </section>
            <form id="contact-form" action="#" method="POST">
                <div class="form-group"> 
                    <label for="name"> Full Name:</label>
                    <input type="text" id="name" name="name"required minlength="2">
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}">
                </div>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Please select a subject</option>
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="billing">Billing Question</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="10" required minlength="10"></textarea>
                </div>
                <div class="form-group">
                    <label for="newsletter">
                        <input type="checkbox" id="newletter" name="newletter">
                        Subscribe to our newsletter
                    </label>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </main>
        <footer>
            <p>&copy; 2026 Ruth Vlismas Ltd. All rights reserved.</p>

        </footer>
    </body>
</html>
